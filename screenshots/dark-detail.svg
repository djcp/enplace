    <svg id="screen" width="1280" height="765" viewBox="0 0 1280 765" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="1280" class="foreground">                                                                                                                                                                </text></g><g id="g2"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="104" font-weight="bold" fill="#d7875f">&#127859;  enplace  </text><text x="120" textLength="8" font-weight="bold" fill="#af8787">/</text><text x="128" textLength="16" class="foreground">  </text><text x="144" textLength="176" fill="#afaf87">Instant Pot Brown Rice</text><text x="320" textLength="544" class="foreground">                                                                    </text><text x="864" textLength="88" fill="#af8787">&#128269; / search</text><text x="952" textLength="24" class="foreground">   </text><text x="976" textLength="80" fill="#af8787">&#9881; m manage</text><text x="1056" textLength="24" class="foreground">   </text><text x="1080" textLength="72" fill="#af8787">&#127968; h home</text><text x="1152" textLength="24" class="foreground">   </text><text x="1176" textLength="72" fill="#af8787">&#128682; q quit</text><text x="1248" textLength="32" class="foreground">    </text></g><g id="g3"><text x="0" textLength="1264" fill="#303030">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text><text x="1264" textLength="16" class="foreground">  </text></g><g id="g4"><text x="0" textLength="176" font-weight="bold" fill="#d7875f">Instant Pot Brown Rice</text><text x="176" textLength="1104" class="foreground">                                                                                                                                          </text></g><g id="g5"><text x="0" textLength="336" fill="#af8787">Prep 5m  &#183;  Cook 50m  &#183;  Serves 8 servings</text><text x="336" textLength="944" class="foreground">                                                                                                                      </text></g><g id="g6"><text x="0" textLength="8" class="foreground"> </text><text x="8" textLength="72" fill="#ffffff">side dish</text><text x="80" textLength="24" class="foreground">   </text><text x="104" textLength="104" fill="#ffffff">pressure cook</text><text x="208" textLength="24" class="foreground">   </text><text x="232" textLength="88" fill="#ffffff">gluten-free</text><text x="320" textLength="24" class="foreground">   </text><text x="344" textLength="40" fill="#ffffff">vegan</text><text x="384" textLength="24" class="foreground">   </text><text x="408" textLength="80" fill="#ffffff">vegetarian</text><text x="488" textLength="792" class="foreground">                                                                                                   </text></g><g id="g7"><text x="0" textLength="768" class="background">Learn how to cook brown rice in the Instant Pot. The process is easy and hands-off, and the rice</text><text x="768" textLength="512" class="foreground">                                                                </text></g><g id="g8"><text x="0" textLength="232" class="background">comes out perfect every time.</text><text x="232" textLength="1048" class="foreground">                                                                                                                                   </text></g><g id="g9"><text x="0" textLength="88" font-weight="bold" fill="#87af87">Ingredients</text><text x="88" textLength="1192" class="foreground">                                                                                                                                                     </text></g><g id="g10"><text x="0" textLength="32" fill="#af8787">  &#183; </text><text x="32" textLength="1248" class="foreground">2 cup brown rice, uncooked, well-rinsed                                                                                                                     </text></g><g id="g11"><text x="0" textLength="32" fill="#af8787">  &#183; </text><text x="32" textLength="1248" class="foreground">2.5 cup water                                                                                                                                               </text></g><g id="g12"><text x="0" textLength="80" font-weight="bold" fill="#87af87">Directions</text><text x="80" textLength="1200" class="foreground">                                                                                                                                                      </text></g><g id="g13"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">                                                                                                </text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g14"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">1. Combine the rinsed brown rice and water in a 6-quart Instant Pot. Secure the lid and Pressure</text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g15"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">Cook on High for 20 minutes.                                                                    </text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g16"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">2. Allow the Instant Pot to release pressure naturally. This will take 20 to 30 minutes. When   </text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g17"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">the float valve drops, remove the lid.                                                          </text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g18"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">3. Fluff the rice and enjoy.                                                                    </text><text x="784" textLength="496" class="foreground">                                                              </text></g><g id="g19"><text x="0" textLength="712" fill="#af8787">Source: https://www.loveandlemons.com/instant-pot-brown-rice/#wprm-recipe-container-61578</text><text x="712" textLength="568" class="foreground">                                                                       </text></g><g id="g20"><text x="0" textLength="216" fill="#af8787">  &#128220; &#8593;/&#8595; scroll   &#127968; h home</text><text x="216" textLength="24" class="foreground">   </text><text x="240" textLength="64" fill="#af8787">&#9999; e edit</text><text x="304" textLength="24" class="foreground">   </text><text x="328" textLength="72" fill="#af8787">&#9878; s scale</text><text x="400" textLength="24" class="foreground">   </text><text x="424" textLength="88" fill="#af8787">&#128190; p export</text><text x="512" textLength="24" class="foreground">   </text><text x="536" textLength="64" fill="#af8787">&#10133; a add</text><text x="600" textLength="24" class="foreground">   </text><text x="624" textLength="80" fill="#af8787">&#128465; d delete</text><text x="704" textLength="24" class="foreground">   </text><text x="728" textLength="64" fill="#af8787">&#9733; r rate</text><text x="792" textLength="24" class="foreground">   </text><text x="816" textLength="80" fill="#af8787">&#128221; N notes</text><text x="896" textLength="208" class="foreground">                          </text><text x="1104" textLength="152" fill="#5f5f5f">enplace 1.2.0-alpha</text><text x="1256" textLength="24" class="foreground">   </text></g></defs><g><use xlink:href="#g1" y="0"/><use xlink:href="#g2" y="17"/><use xlink:href="#g1" y="34"/><use xlink:href="#g3" y="51"/><use xlink:href="#g1" y="68"/><use xlink:href="#g4" y="85"/><use xlink:href="#g5" y="102"/><rect x="0" y="119" width="88" height="17" fill="#d7875f"/><rect x="96" y="119" width="120" height="17" fill="#87af87"/><rect x="224" y="119" width="104" height="17" fill="#5fafaf"/><rect x="336" y="119" width="56" height="17" fill="#5fafaf"/><rect x="400" y="119" width="96" height="17" fill="#5fafaf"/><use xlink:href="#g6" y="119"/><use xlink:href="#g1" y="136"/><rect x="0" y="153" width="768" height="17" fill="#afaf87"/><use xlink:href="#g7" y="153"/><rect x="0" y="17